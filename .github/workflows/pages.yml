name: Build and deploy the Learning Center experiences

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the learning center
        uses: actions/checkout@v6

      - name: Check out the Physics acoustic model
        id: physics
        uses: actions/checkout@v6
        with:
          repository: TrentBest/TheSingularityWorkshop.Physics
          ref: development
          path: physics-source

      - name: Check out the Visualize presentation backend
        id: visualize
        uses: actions/checkout@v6
        with:
          repository: TrentBest/TheSingularityWorkshop.Visualize
          ref: development
          path: visualize-source

      - name: Check out the WebPage city and campus catalogs
        id: webpage
        uses: actions/checkout@v6
        with:
          repository: TrentBest/WebPage
          ref: development
          path: webpage-source

      - name: Check out the FSM_API development source
        id: fsmapi
        uses: actions/checkout@v6
        with:
          repository: TrentBest/FSM_API
          ref: development
          path: fsm-api-source

      - name: Check out the FSM_UserIO semantic boundary
        id: userio
        uses: actions/checkout@v6
        with:
          repository: TrentBest/FSM_UserIO
          ref: master
          path: fsm-userio-source

      - name: Install .NET 8 for the Physics, Visualize, and UserIO models
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Compute the acoustic run from Physics source
        shell: bash
        run: |
          mkdir -p _site/data
          dotnet run --project physics-source/tools/FirstOrderRoomReflectionRunRecordGenerator/FirstOrderRoomReflectionRunRecordGenerator.csproj --configuration Release -- _site/data/first-order-room-reflection.run.json
          dotnet run --project physics-source/tools/FirstOrderRoomReflectionRunRecordGenerator/FirstOrderRoomReflectionRunRecordGenerator.csproj --configuration Release -- physics-source/docs/experiments/first-order-room-reflection.run.json --check
          cmp _site/data/first-order-room-reflection.run.json physics-source/docs/experiments/first-order-room-reflection.run.json
          printf '%s\n' '${{ steps.physics.outputs.commit }}' > _site/data/physics-source-commit.txt

      - name: Generate the city and campus maps through Visualize
        run: dotnet run --project tools/CampusVisualize/CampusVisualize.csproj --configuration Release -- _site/data/city-map.svg _site/data/campus-map.svg _site/data/city-places.json _site/data/campus-buildings.json webpage-source/TheSingularityWorkshop/Workshop/Spatial/SingularityCityCatalog.cs webpage-source/TheSingularityWorkshop/Workshop/Spatial/SingularityCampusCatalog.cs

      - name: Install .NET 10 for the browser showcase
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test the browser WebGPU adapter
        run: dotnet test tests/FsmApiShowcase.Tests/FsmApiShowcase.Tests.csproj --configuration Release

      - name: Build the browser showcase
        run: dotnet publish apps/FsmApiShowcase/FsmApiShowcase.csproj --configuration Release

      - name: Assemble the static Pages site
        shell: bash
        run: |
          mkdir -p _site/demo _site/data
          cp physics-source/docs/experiments/first-order-room-reflection.svg _site/data/first-order-room-reflection.svg
          printf '%s\n' '${{ steps.webpage.outputs.commit }}' > _site/data/webpage-source-commit.txt
          printf '%s\n' '${{ steps.visualize.outputs.commit }}' > _site/data/visualize-source-commit.txt
          cp index.html _site/index.html
          cp frontier.html _site/frontier.html
          cp -R apps/FsmApiShowcase/bin/Release/net10.0/publish/wwwroot/. _site/demo/
          sed -i 's|<base href="/" />|<base href="/TheSingularityWorkshop.Learning/demo/" />|' _site/demo/index.html
          touch _site/.nojekyll
          touch _site/demo/.nojekyll
          grep -F '<base href="/TheSingularityWorkshop.Learning/demo/" />' _site/demo/index.html

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Build and deploy the FSM_API lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the learning center
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the browser showcase
        run: dotnet publish apps/FsmApiShowcase/FsmApiShowcase.csproj --configuration Release

      - name: Assemble the static Pages site
        shell: bash
        run: |
          mkdir -p _site/demo
          cp index.html _site/index.html
          cp -R apps/FsmApiShowcase/bin/Release/net10.0/publish/wwwroot/. _site/demo/
          sed -i 's|<base href="/" />|<base href="/TheSingularityWorkshop.Learning/demo/" />|' _site/demo/index.html
          touch _site/.nojekyll
          touch _site/demo/.nojekyll
          grep -F '<base href="/TheSingularityWorkshop.Learning/demo/" />' _site/demo/index.html

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
